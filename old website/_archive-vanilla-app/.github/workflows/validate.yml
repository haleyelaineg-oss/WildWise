name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax
        run: |
          set -e
          node --check src/lib/auth.js src/lib/api.js src/pages/auth/login.js src/pages/auth/register.js src/pages/volunteer/dashboard.js src/pages/volunteer/my-schedule.js src/pages/rehabber/volunteers.js
