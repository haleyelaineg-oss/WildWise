<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — WildWise</title>
  <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/styles/variables.css" />
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/forms.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-page">

  <div class="auth-layout">

    <!-- Brand panel -->
    <div class="auth-panel auth-panel--brand">
      <a href="/" class="auth-brand">
        <img src="/assets/images/full-color-circle-logo.png"
             alt="WildWise logo" class="auth-brand__logo" />
        <span class="auth-brand__wordmark">
          <span class="wild">WILD</span><span class="wise">WISE</span>
        </span>
      </a>
      <blockquote class="auth-panel__quote">
        "Every animal deserves a chance. Every rehabber deserves the tools to give them one."
      </blockquote>
    </div>

    <!-- Form panel -->
    <div class="auth-panel auth-panel--form">
      <div class="auth-form-wrap">
        <div class="auth-form-wrap__header">
          <h1>Welcome back</h1>
          <p>Sign in to your WildWise account.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label required" for="email">Email address</label>
            <input class="form-input" type="email" id="email" name="email"
                   autocomplete="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label class="form-label required" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password"
                   autocomplete="current-password" placeholder="••••••••" required />
          </div>

          <div class="auth-form-wrap__options">
            <label class="form-check">
              <input type="checkbox" name="remember" />
              <span class="form-check__label">Remember me</span>
            </label>
            <a href="forgot-password.html" class="auth-link">Forgot password?</a>
          </div>

          <div id="loginError" class="auth-error" hidden></div>

          <button type="submit" class="btn-primary auth-submit" id="loginBtn">
            Sign In
          </button>
        </form>

        <p class="auth-form-wrap__footer">
          Don't have an account?
          <a href="register.html" class="auth-link">Create one</a>
        </p>
      </div>
    </div>

  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
