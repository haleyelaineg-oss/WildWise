<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — WildWise</title>
  <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/styles/variables.css" />
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/forms.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-page">

  <div class="auth-layout">
    <div class="auth-panel auth-panel--brand">
      <a href="/" class="auth-brand">
        <img src="/assets/images/single-color-logo-circle-dark.png" alt="WildWise logo" class="auth-brand__logo" />
        <span class="auth-brand__wordmark">
          <span class="wild">WILD</span><span class="wise">WISE</span>
        </span>
      </a>
    </div>

    <div class="auth-panel auth-panel--form">
      <div class="auth-form-wrap">

        <!-- Request form -->
        <div id="requestView">
          <div class="auth-form-wrap__header">
            <h1>Reset your password</h1>
            <p>Enter your email and we'll send you a reset link.</p>
          </div>
          <form id="resetForm" novalidate>
            <div class="form-group">
              <label class="form-label required" for="email">Email address</label>
              <input class="form-input" type="email" id="email" name="email"
                     autocomplete="email" placeholder="you@example.com" required />
            </div>
            <div id="resetError" class="auth-error" hidden></div>
            <button type="submit" class="btn-primary auth-submit" id="resetBtn">
              Send Reset Link
            </button>
          </form>
          <p class="auth-form-wrap__footer">
            <a href="login.html" class="auth-link">← Back to sign in</a>
          </p>
        </div>

        <!-- Success state -->
        <div id="successView" hidden style="text-align:center;padding:var(--space-8) 0;">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--color-success-bg);color:var(--color-success);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-5);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 style="font-size:var(--text-2xl);margin-bottom:var(--space-3);">Check your inbox</h2>
          <p style="color:var(--color-text-muted);max-width:36ch;margin:0 auto var(--space-8);">
            We've sent a password reset link to <strong id="sentTo"></strong>.
            The link expires in 1 hour.
          </p>
          <a href="login.html" class="btn-secondary">Back to sign in</a>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="forgot-password.js"></script>
</body>
</html>
