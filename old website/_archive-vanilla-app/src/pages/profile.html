<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — WildWise</title>
  <link rel="stylesheet" href="/styles/variables.css" />
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/dashboard-layout.css" />
</head>
<body class="app-shell">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a href="/" class="sidebar__logo">
      <img src="/assets/images/single-color-logo-circle-dark.png" alt="WildWise logo mark" class="sidebar__logo-mark" />
      <span class="sidebar__logo-text"><span class="wild">WILD</span><span class="wise">WISE</span></span>
    </a>
    <nav class="sidebar__nav" id="sidebarNav"></nav>
    <div class="sidebar__footer">
      <div class="sidebar__user" id="sidebarUser" role="button" tabindex="0" aria-label="User menu">
        <div class="sidebar__avatar" id="sidebarAvatar">?</div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name" id="sidebarUserName">Loading…</div>
          <div class="sidebar__user-role" id="sidebarUserRole"></div>
        </div>
      </div>
    </div>
  </aside>

  <header class="topbar" id="topbar">
    <div class="topbar__left">
      <button class="topbar__hamburger" id="sidebarToggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <h1 class="topbar__page-title" id="pageTitle">Profile</h1>
    </div>
    <div class="topbar__right">
      <button class="topbar__action" aria-label="Sign out" id="signOutBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header__text">
          <h1>Your Profile</h1>
          <p>View your account role and approval status.</p>
        </div>
      </div>

      <section class="stat-card">
        <div id="profileInfo">Loading profile...</div>
      </section>
    </div>
  </main>

  <script type="module" src="profile.js"></script>
</body>
</html>
