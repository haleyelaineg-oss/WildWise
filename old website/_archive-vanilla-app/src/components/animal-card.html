<!-- WildWise — Animal Card component
     Clone this template and populate via JS, or use animal-card.js helpers.

     Data attributes used:
       data-case-id, data-species, data-status, data-intake-date,
       data-location, data-assigned-to, data-photo-url
-->

<template id="animalCardTemplate">
  <article class="animal-card">
    <div class="animal-card__photo">
      <img src="" alt="" class="animal-card__img" loading="lazy" />
      <div class="animal-card__photo-placeholder" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </div>
      <span class="animal-card__status case-status" data-status></span>
    </div>
    <div class="animal-card__body">
      <div class="animal-card__case-id">Case <span data-field="case-id"></span></div>
      <h3 class="animal-card__species" data-field="species">Unknown Species</h3>
      <dl class="animal-card__meta">
        <dt>Intake</dt>
        <dd data-field="intake-date">—</dd>
        <dt>Location</dt>
        <dd data-field="location">—</dd>
        <dt>Assigned to</dt>
        <dd data-field="assigned-to">—</dd>
      </dl>
    </div>
    <div class="animal-card__footer">
      <a href="#" class="animal-card__link" data-field="detail-link">View Details</a>
    </div>
  </article>
</template>
